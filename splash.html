<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML Algo Visualizer</title>
  <style>
    :root {
      --bg: #0a101a;
      --panel: rgba(16, 24, 38, 0.9);
      --text: #f7f7f5;
      --muted: rgba(247, 247, 245, 0.74);
      --cyan: #4cc9f0;
      --gold: #ffcb77;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(76, 201, 240, 0.16), transparent 24%),
        radial-gradient(circle at 85% 10%, rgba(255, 203, 119, 0.14), transparent 20%),
        linear-gradient(180deg, #0a101a 0%, #0c1422 100%);
    }

    .card {
      width: min(92vw, 560px);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 40px);
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .loader {
      width: 64px;
      height: 64px;
      margin: 28px auto 18px;
      border-radius: 999px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--cyan);
      animation: spin 1s linear infinite;
    }

    .status {
      margin-top: 8px;
      font-size: 15px;
      color: var(--text);
    }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Launching</div>
    <h1>ML Algo Visualizer</h1>
    <p>Preparing the interactive machine learning visualizer. You will be redirected to the home page automatically.</p>
    <div class="loader"></div>
    <div class="status" id="status">Starting local server...</div>
    <div class="hint">If it takes more than a few seconds, keep this page open while the app boots.</div>
  </div>

  <script>
    const targetUrl = "http://localhost:8501";
    const probeImage = new Image();
    const statusNode = document.getElementById("status");

    const tryOpenApp = () => {
      probeImage.onload = () => {
        statusNode.textContent = "Server is ready. Opening app...";
        window.location.replace(targetUrl);
      };
      probeImage.onerror = () => {
        statusNode.textContent = "Starting local server...";
        setTimeout(tryOpenApp, 1200);
      };
      probeImage.src = `${targetUrl}/favicon.png?ts=${Date.now()}`;
    };

    tryOpenApp();
  </script>
</body>
</html>
